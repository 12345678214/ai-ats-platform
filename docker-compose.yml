# One-command local stack:  docker compose up --build
# Then seed demo data:      docker compose exec server npm run db:seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats
      POSTGRES_DB: ats
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build: ./ai-service
    environment:
      AI_SERVICE_KEY: docker-shared-service-key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build: ./server
    depends_on:
      db: { condition: service_healthy }
      ai: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ats:ats@db:5432/ats?schema=public
      JWT_SECRET: replace-with-a-long-random-string-of-at-least-32-chars
      CLIENT_URL: http://localhost:8080
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_KEY: docker-shared-service-key
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["4000:4000"]

  client:
    build: ./client
    depends_on: [server]
    ports: ["8080:80"]

volumes:
  pgdata:
  uploads:
